[workspace]
# Allow release-plz to manage a single crate in the repository root.
release = true
# Maintain CHANGELOG.md in release PRs so releases carry changelog bodies.
changelog_update = true
changelog_path = "./CHANGELOG.md"

[[package]]
name = "model2vec-serve"
# Do not publish to crates.io; this is an application binary distributed as a
# container image. The `publish = false` field in Cargo.toml is also respected.
publish = false
# Publish a GitHub release and tag for each release.
git_release_enable = true
git_tag_enable = true
# v-prefixed tags match the docker workflow's `v*` trigger and keep app tags
# separate from chart-releaser's `model2vec-serve-<chart-version>` tags.
git_tag_name = "v{{ version }}"
# Include the generated changelog in the GitHub release body.
git_release_body = "{{ changelog }}"
# Disable cargo-semver-checks: this is an unpublished application binary, so
# there is no crates.io baseline to compare against.
semver_check = false
