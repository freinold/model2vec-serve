[workspace]
# Allow release-plz to manage a single crate in the repository root.
release = true
# Maintain CHANGELOG.md in release PRs so releases carry changelog bodies.
changelog_update = true
changelog_path = "./CHANGELOG.md"

[[package]]
name = "model2vec-serve"
# Skip crates.io publishing and use the git-only release path (tag + GitHub
# release). This must live HERE, not in Cargo.toml: the release command only
# processes packages that are publishable per Cargo.toml, and routes them to
# the registry or git-only path based on this setting. With `publish = false`
# in Cargo.toml the package is skipped by both release commands entirely.
publish = false
# Process this package via git only (tag + GitHub release). Without this flag
# release-plz skips `publish = false` packages entirely: release PRs and
# releases are only prepared for packages publishable to a registry or
# explicitly marked git-only.
git_only = true
# Publish a GitHub release and tag for each release.
git_release_enable = true
git_tag_enable = true
# v-prefixed tags match the docker workflow's `v*` trigger and keep app tags
# separate from chart-releaser's `model2vec-serve-<chart-version>` tags.
git_tag_name = "v{{ version }}"
# Include the generated changelog in the GitHub release body.
git_release_body = "{{ changelog }}"
# Disable cargo-semver-checks: this is an unpublished application binary, so
# there is no crates.io baseline to compare against.
semver_check = false
