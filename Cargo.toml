[package]
name = "model2vec-serve"
version = "0.5.4"
edition = "2024"
# Keep in sync with the MSRV floor of security-relevant dependencies:
# time 0.3.46+ requires 1.88, and a lower MSRV makes cargo update downgrade
# the lockfile below the patched versions after every renovate security bump.
rust-version = "1.88"
authors = ["freinold"]
license = "MIT"
description = "Lightweight OpenAI and TEI compatible embeddings server for model2vec models"
repository = "https://github.com/freinold/model2vec-serve"
# Keep release detection scoped to the Rust package: release-plz opens a
# release PR when any packaged file changes. Without these excludes, commits
# touching docs, Helm charts, or CI would trigger releases — including the
# automated chart bump, which would loop forever.
exclude = [
    "/.dockerignore",
    "/.env.example",
    "/.github",
    "/.gitignore",
    "/.helmignore",
    "/.opencode",
    "/.release-plz.toml",
    "/.specify",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/cr.yaml",
    "/ct.yaml",
    "/docker-compose.yml",
    "/docs",
    "/helm",
    "/scripts",
    "/specs",
    "/tests",
]

[[bin]]
name = "model2vec-serve"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
model2vec-rs = "0.2"
rustls = "0.23"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "trace",
    "timeout",
    "cors",
    "compression-full",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "json",
    "env-filter",
    "fmt",
] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
http-body-util = "0.1"
hf-hub = { version = "1", features = ["blocking"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }
serde_json = "1"
tempfile = "3"
time = "0.3"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "embeddings"
harness = false

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
