name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # PAT so the created tag/release trigger downstream workflows
          # (GITHUB_TOKEN events do not start new workflow runs).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # PAT so the opened release PR can trigger CI checks.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  helm-chart-bump:
    name: Helm chart bump
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # PAT so the chart-bump commit triggers helm-release.yml and ci.yml
          # (GITHUB_TOKEN pushes do not start new workflow runs). The token is
          # not persisted by checkout; scripts/bump_chart.sh scopes it to the
          # single git push it performs.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Set up git user
        uses: fregante/setup-git-user@v2

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Determine released app version
        id: app-version
        env:
          RELEASES_JSON: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          version="$(echo "$RELEASES_JSON" | jq -r '.[0].version')"
          echo "Released app version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Wait for the docker image build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          tag="v${{ steps.app-version.outputs.version }}"
          sha="$(git rev-parse "${tag}^{commit}")"
          echo "Waiting for a docker.yml run for ${tag} (${sha})"
          run_id=""
          for _ in $(seq 1 30); do
            # Only the tag-triggered push run builds the semver image tag;
            # a workflow_dispatch run for the same sha would not.
            run_id="$(gh run list --workflow docker.yml --event push --commit "$sha" \
              --json databaseId,headBranch \
              --jq '.[] | "\(.databaseId) \(.headBranch)"' \
              | awk -v t="${tag}" '$2 == t {print $1; exit}' || true)"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::No docker.yml push run for ${tag} found after 5 minutes"
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 30

      - name: Bump chart and docs
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: bash scripts/bump_chart.sh
