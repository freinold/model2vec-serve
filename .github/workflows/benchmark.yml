# SC-005 transport benchmark with the deterministic delta gate.
#
# Runs only for Rust-relevant changes — docs, Helm, and spec changes skip
# the ~6-minute release build entirely. On shared runners the gate uses the
# noise-stable signals (median latency + throughput); p99 on sub-millisecond
# loopback samples swings ±20% between runners and stays in the recorded
# output for release review. The step is reporting-only (continue-on-error):
# a gate failure stays visible as an annotation without blocking the PR.
#
# The job also runs on pushes to main so the rust-cache stays warm and
# regressions are caught after merge.
name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run transport benchmark with SC-005 gate
        continue-on-error: true
        run: TLS_BENCH_MAX_DELTA_PCT=10 cargo bench --bench embeddings -- --measurement-time 3 --warm-up-time 1 --sample-size 10 "transport"
