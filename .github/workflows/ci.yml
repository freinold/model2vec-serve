name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  helm:
    runs-on: ubuntu-latest
    env:
      COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Run Helm lint
        run: bash tests/helm/lint_test.sh
      - name: Run Helm template validation
        run: bash tests/helm/template_test.sh
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run chart-testing lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}
      - name: Create kind cluster
        if: "steps.list-changed.outputs.changed == 'true' && ! contains(env.COMMIT_MSG, '[skip install]')"
        uses: helm/kind-action@v1
      - name: Run chart-testing install
        if: "steps.list-changed.outputs.changed == 'true' && ! contains(env.COMMIT_MSG, '[skip install]')"
        run: ct install --target-branch ${{ github.event.repository.default_branch }} --debug

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Docker Compose configuration
        run: bash tests/compose/compose_config_test.sh

  benchmark:
    # SC-005 transport benchmark with the deterministic delta gate.
    # Shared runners are noisy, so this job is reporting-only: the gate
    # uses the noise-stable signals (median latency + throughput); p99 on
    # sub-millisecond loopback samples swings ±20% between runners and
    # stays in the recorded output for release review. continue-on-error
    # lives on the step so the check run itself passes while the failure
    # stays visible as an annotation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run transport benchmark with SC-005 gate
        continue-on-error: true
        run: TLS_BENCH_MAX_DELTA_PCT=10 cargo bench --bench embeddings -- --measurement-time 3 --warm-up-time 1 --sample-size 10 "transport"
